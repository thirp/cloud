openapi: 3.0.3
info:
  title: Thirp Control Plane API
  version: "1.0.0"
  description: Versioned JSON API for Thirp Cloud. Public `/v1` is tenant-facing. `/healthz` and `/readyz` are unauthenticated liveness/readiness. `/console` is an HTML presentation over this API, not a second contract. Audit events are retained 90 days. Usage is derived from connection records. Webhook POSTs are HMAC-SHA256 over `{unix_seconds}.{body}` with headers Thirp-Timestamp, Thirp-Signature (`t=...,v1=...`), Thirp-Event-Id, and Idempotency-Key; replay window is 5 minutes.
servers:
  - url: https://api.thirp.io
paths:
  /v1/openapi.yaml:
    get:
      summary: OpenAPI document
      security: []
      responses:
        "200":
          description: YAML contract
  /v1/auth/login/start:
    post:
      summary: Start login
      security: []
      responses:
        "200":
          description: Authorization URL and PKCE verifier
  /v1/auth/login/complete:
    post:
      summary: Complete login
      security: []
      responses:
        "200":
          description: Session token and expires_at
        "403":
          description: email_unverified when the ID token email is not verified
  /v1/auth/login/browser:
    get:
      summary: Browser login redirect to the identity provider
      security: []
      responses:
        "302":
          description: Redirect to IdP or local callback
  /v1/auth/login/email-unverified:
    get:
      summary: Browser interstitial after OIDC login when email is not verified
      security: []
      responses:
        "200":
          description: HTML asking the user to verify email before continuing
  /v1/auth/login/failed:
    get:
      summary: Browser interstitial after OIDC login failure
      security: []
      responses:
        "200":
          description: HTML sign-in failure page (does not restart IdP SSO)
  /v1/auth/oidc/callback:
    get:
      summary: OIDC/browser login callback
      security: []
      responses:
        "302":
          description: Sets session cookie (Path=/) and redirects to next, or to email-unverified / failed pages
        "204":
          description: Prefetch of the callback does not consume the login challenge
  /v1/session:
    get:
      summary: Current user, memberships, and session expiry
      responses:
        "200":
          description: user, active memberships with scope, expires_at, mfa_verified
        "401":
          description: Unauthenticated
  /v1/auth/session/refresh:
    post:
      summary: Rotate the current session token
      responses:
        "200":
          description: New session token and expires_at
  /v1/auth/device:
    post:
      summary: Start device authorization
      security: []
      responses:
        "200":
          description: device_code, user_code, verification_uri, interval, expires_in
    get:
      summary: Device verification HTML page
      security: []
      responses:
        "200":
          description: HTML form
  /v1/auth/device/poll:
    post:
      summary: Poll device authorization
      security: []
      responses:
        "200":
          description: Session token after approval
        "400":
          description: authorization_pending, slow_down, expired_token, or access_denied
  /v1/auth/device/approve:
    post:
      summary: Approve or deny a device user code
      responses:
        "200":
          description: Approved
  /v1/auth/logout:
    post:
      summary: Logout
      responses:
        "200":
          description: Logged out
  /v1/auth/invitations:
    get:
      summary: Pending invitations for the session email
      responses:
        "200":
          description: Invitation list with presentation fields, without tokens
  /v1/auth/invitations/{id}:
    get:
      summary: Inspect an invitation for the session email
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Invitation presentation including state and requested_approval_policy
        "401":
          description: Unauthenticated
        "404":
          description: Unknown id or email mismatch
  /v1/auth/invitations/accept:
    post:
      summary: Accept invitation by token
      responses:
        "200":
          description: Membership
  /v1/auth/invitations/{id}/accept:
    post:
      summary: Accept invitation by id when session email matches
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Membership
        "404":
          description: Unknown, expired, or email mismatch
  /v1/signup:
    post:
      summary: Create an organization as its owner
      description: Requires a signed-in session with a verified email. Body email is ignored. In one transaction, applies existing IP/domain signup limits and creates the organization, owner membership, subscription and audit. An eligible first organization starts its trial immediately; later organizations get needs_plan and can check out. No admission or operator step. With THIRP_SIGNUP_REQUIRE_CARD enabled, eligible first organizations also get needs_plan, and Checkout collects a card with subscription_data[trial_period_days] set to the trial length. The US business and Terms/Privacy attestation is accept_terms; there is no geo-block or qualification gate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, accept_terms]
              properties:
                name: {type: string}
                slug: {type: string}
                accept_terms: {type: boolean, enum: [true]}
      responses:
        "201":
          description: Organization created. trial_started determines organization overview versus Billing destination.
          content:
            application/json:
              schema: &signup_response
                type: object
                required: [organization_id, slug, trial_started, checkout_required]
                properties:
                  organization_id: {type: string, format: uuid}
                  slug: {type: string}
                  trial_started: {type: boolean}
                  checkout_required: {type: boolean, description: Eligible card-required signup; console opens existing monthly Checkout with zero extras.}
        "200":
          description: Idempotent repeat for the same slug already owned by the session user.
          content:
            application/json:
              schema: *signup_response
        "400":
          description: terms_not_accepted (accept_terms absent or not true), or invalid_request (invalid name/slug).
        "401":
          description: unauthorized (missing or unusable session).
        "403":
          description: email_unverified (no verified session email; unverified OIDC login is also refused before session issuance).
        "409":
          description: slug_taken. The error envelope includes a top-level suggested_slug containing an available suffixed slug, such as acme-2.
          content:
            application/json:
              schema:
                type: object
                required: [error, suggested_slug]
                properties:
                  error:
                    type: object
                    properties:
                      code: {type: string, enum: [slug_taken]}
                      message: {type: string}
                      request_id: {type: string}
                  suggested_slug: {type: string}
        "429":
          description: signup_refused (existing per-IP or per-domain signup rate limit).
  /v1/billing/webhook:
    post:
      summary: Stripe billing webhook
      security: []
      description: Verifies Stripe-Signature (HMAC-SHA256 over t.rawBody, 300 second skew; accept any matching v1 signature). Idempotent on event id. Does not store the payload. Handles checkout.session.completed, customer.subscription.created, customer.subscription.updated, customer.subscription.deleted, customer.subscription.paused, customer.subscription.resumed, invoice.paid, invoice.payment_failed, invoice.finalization_failed, charge.refunded, and charge.dispute.created. Unknown events are recorded and acknowledged without applying.
      parameters:
        - {name: Stripe-Signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Event recorded
        "400":
          description: invalid_request (missing header, bad signature, or stale timestamp)
  /v1/admission:
    get:
      summary: Inspect the current admission for the session email
      responses:
        "200":
          description: Admission without token
        "404":
          description: No matching issued or accepted admission
  /v1/admission/accept:
    post:
      summary: Accept admission and create Organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, terms_version]
              properties:
                token: {type: string, description: Optional. Omitted for a self-serve admission matched to the session email.}
                name: {type: string}
                slug: {type: string}
                terms_version: {type: string}
      responses:
        "201":
          description: Admission accepted with Organization
        "404":
          description: Unknown token, email mismatch, or already used by another user
  /v1/organizations:
    get:
      summary: List organizations for the session user
      responses:
        "200":
          description: Organization list
  /v1/organizations/{org_id}:
    get:
      summary: Get organization
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Organization
  /v1/organizations/{org_id}/memberships:
    get:
      summary: List memberships
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Membership list
  /v1/organizations/{org_id}/memberships/{id}:
    get:
      summary: Get membership
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Membership
  /v1/organizations/{org_id}/memberships/{id}/suspend:
    post:
      summary: Suspend membership
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Membership
  /v1/organizations/{org_id}/memberships/{id}/remove:
    post:
      summary: Remove membership
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Membership
  /v1/organizations/{org_id}/memberships/{id}/role:
    post:
      summary: Change membership role
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Membership
  /v1/organizations/{org_id}/invitations:
    get:
      summary: List pending invitations in actor scope
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Invitation list without tokens
    post:
      summary: Invite by email
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Invitation token once
  /v1/organizations/{org_id}/invitations/{id}/revoke:
    post:
      summary: Revoke invitation
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Revoked
  /v1/organizations/{org_id}/environments:
    get:
      operationId: list_environments
      summary: list environments
      description: List environments with additive agent_status (online, offline, missing-agent) and Services.
      parameters:
        - {"name":"org_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
        - {"name":"limit","in":"query","schema":{"type":"integer"}}
        - {"name":"cursor","in":"query","schema":{"type":"string"}}
      responses:
        "200":
          description: Successful existing API response
          content:
            application/json:
              schema: {"type":"object","properties":{"items":{"type":"array","items":{"type":"object","properties":{"agent_status":{"type":"string","enum":["online","offline","missing-agent"]},"services":{"type":"array","items":{"type":"object"}}}}},"next_cursor":{"type":"string","nullable":true}}}
    post:
      summary: Create environment
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Environment
  /v1/organizations/{org_id}/environments/{id}:
    get:
      summary: Get environment
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Environment
    patch:
      summary: Update environment
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Environment
  /v1/organizations/{org_id}/environments/{id}/disable:
    post:
      summary: Disable environment
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Environment
  /v1/organizations/{org_id}/environments/{id}/archive:
    post:
      summary: Archive environment
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Environment
  /v1/organizations/{org_id}/environments/{id}/approval-policy/revoke:
    post:
      summary: Revoke vendor approval delegation
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Environment with Customer approval required; active grants in the Environment are revoked
  /v1/organizations/{org_id}/environments/{id}/approval-policy/grant:
    post:
      summary: Grant vendor approval delegation
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Environment with Vendor approval permitted with audit
  /v1/organizations/{org_id}/services:
    get:
      summary: List services
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: environment_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Service list
    post:
      summary: Create service
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Service
  /v1/organizations/{org_id}/services/{id}:
    get:
      summary: Get service
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Service with catalog `state` and `registration` live status
    patch:
      summary: Update service
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Service
  /v1/organizations/{org_id}/services/{id}/disable:
    post:
      summary: Disable service
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Service
  /v1/organizations/{org_id}/services/{id}/archive:
    post:
      summary: Archive service
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Service
  /v1/organizations/{org_id}/audit-events:
    get:
      operationId: list_audit
      summary: list audit
      description: Existing audit list with existing scope and filters.
      parameters:
        - {"name":"org_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
        - {"name":"limit","in":"query","schema":{"type":"integer"}}
        - {"name":"cursor","in":"query","schema":{"type":"string"}}
        - {"name":"action","in":"query","schema":{"type":"string"}}
        - {"name":"since","in":"query","schema":{"type":"string","format":"date-time"}}
        - {"name":"until","in":"query","schema":{"type":"string","format":"date-time"}}
        - {"name":"correlation_id","in":"query","schema":{"type":"string"}}
        - {"name":"environment_id","in":"query","schema":{"type":"string"}}
        - {"name":"actor_id","in":"query","schema":{"type":"string"}}
        - {"name":"order","in":"query","schema":{"type":"string"}}
        - {"name":"offset","in":"query","schema":{"type":"integer"}}
      responses:
        "200":
          description: Successful existing API response
  /v1/organizations/{org_id}/audit-events/export:
    get:
      summary: Export audit events as JSON or CSV
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: format, in: query, schema: {type: string, enum: [json, csv]}}
        - {name: action, in: query, schema: {type: string}}
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: until, in: query, schema: {type: string, format: date-time}}
        - {name: correlation_id, in: query, schema: {type: string, format: uuid}}
        - {name: environment_id, in: query, schema: {type: string, format: uuid}}
        - {name: actor_id, in: query, schema: {type: string}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
      responses:
        "200":
          description: items array (JSON) or CSV; hard cap 10000 rows; over-cap is 400 invalid_request. Appends audit.export.
  /v1/organizations/{org_id}/billing:
    get:
      summary: Subscription status for the organization
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Status, plan, extra Environments, environment quota, billing period, days_left, read_only, and the display amounts. Empty status when the organization has no subscription row.
  /v1/organizations/{org_id}/billing/checkout:
    post:
      summary: Stripe-hosted Checkout session
      description: Owner with MFA. Body is interval (month or year) and extra_env_quantity. Creates a Stripe-hosted Checkout Session. Extra Environments are split across up to three prices. Quantity above 497 is 400 Talk to us; missing required band prices are invalid request.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Stripe-hosted Checkout URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: {type: string, format: uri, description: Stripe-hosted Checkout URL}
  /v1/organizations/{org_id}/billing/subscription:
    post:
      summary: Update extra Environment quantity on the current subscription
      description: Owner with MFA and a live subscription. Body is extra_env_quantity. The server recomputes the band split and POSTs a Stripe subscription update to /v1/subscriptions/{id} with the full items list and proration_behavior always_invoice. Quantity above 497 is 400 Talk to us.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Stripe subscription update with proration_behavior always_invoice
  /v1/organizations/{org_id}/billing/portal:
    post:
      summary: Stripe customer portal session
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Stripe portal URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: {type: string, format: uri}
  /v1/organizations/{org_id}/usage:
    get:
      summary: Usage summary for a time window
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: environment_id, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Gauges plus windowed connection counters and quotas. Default window last 24h, max 90 days.
  /v1/organizations/{org_id}/events:
    get:
      summary: Poll organization vendor events
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Monotonic seq cursor. Metadata payload only.
  /v1/organizations/{org_id}/webhooks:
    get:
      summary: List webhook endpoints
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Webhook list (secret omitted)
    post:
      summary: Create webhook endpoint
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "201":
          description: Endpoint including secret once
  /v1/organizations/{org_id}/webhooks/{wid}:
    get:
      summary: Get webhook endpoint
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: wid, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Endpoint without secret
  /v1/organizations/{org_id}/webhooks/{wid}/disable:
    post:
      summary: Disable webhook endpoint
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: wid, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Disabled endpoint
  /v1/organizations/{org_id}/webhooks/{wid}/deliveries:
    get:
      summary: List webhook deliveries
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: wid, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Delivery attempts including failed/dead-letter
  /status:
    get:
      summary: Public status page
      responses:
        "200":
          description: API, database, and broker, each up or down, with the check time
  /healthz:
    get:
      summary: Liveness
      responses:
        "200":
          description: Process is up
  /readyz:
    get:
      summary: Readiness
      responses:
        "200":
          description: Store is reachable
        "503":
          description: Store unavailable
  /v1/regions/{id}:
    get:
      summary: Inspect region endpoint, state, and operational_status
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Region with operational_status (healthy|draining|replacing|unavailable) and optional active broker summary
  /v1/organizations/{org_id}/identities:
    get:
      summary: List integration identities
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Identity list
    post:
      summary: Create integration identity
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Identity
  /v1/organizations/{org_id}/identities/{id}:
    get:
      summary: Get identity
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Identity
  /v1/organizations/{org_id}/identities/{id}/disable:
    post:
      summary: Disable identity
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Identity
  /v1/organizations/{org_id}/identities/{id}/credentials:
    post:
      summary: Issue or rotate credential
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "201":
          description: Credential plaintext once
  /v1/organizations/{org_id}/identities/{id}/credentials/{cid}/revoke:
    post:
      summary: Revoke credential
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cid, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Revoked
  /v1/organizations/{org_id}/environments/{env_id}/agents:
    post:
      summary: Create Agent and one-use enrollment token
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/EnvId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Agent and enrollment token once
  /v1/organizations/{org_id}/agents:
    get:
      summary: List Agents
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Agent list
  /v1/organizations/{org_id}/agents/{id}:
    get:
      summary: Get Agent
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Agent including `last_seen_at` and `online`
  /v1/organizations/{org_id}/agents/{id}/disable:
    post:
      summary: Disable Agent
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Agent
  /v1/organizations/{org_id}/agents/{id}/credentials:
    post:
      summary: Rotate Agent credential
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "201":
          description: Agent credential plaintext once
  /v1/organizations/{org_id}/agents/{id}/credentials/{cid}/revoke:
    post:
      summary: Revoke Agent credential
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cid, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Revoked
  /v1/organizations/{org_id}/environments/{env_id}/enrollments/{id}/revoke:
    post:
      summary: Revoke unused enrollment
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/EnvId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Revoked
  /v1/agent-enrollments/exchange:
    post:
      summary: Exchange enrollment token for Agent credential
      security: []
      responses:
        "201":
          description: Agent credential, region endpoint, and TLS fields once
  /v1/organizations/{org_id}/environments/{env_id}/access-requests:
    post:
      operationId: request_access
      summary: request access
      description: Create existing time-bounded access request. Supply duration_seconds or requested_end_at.
      parameters:
        - {"name":"org_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
        - {"name":"env_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"catalog_service_ids":{"type":"array","minItems":1,"items":{"type":"string","format":"uuid"}},"reason":{"type":"string"},"external_case_id":{"type":"string"},"duration_seconds":{"type":"integer","minimum":60,"maximum":28800},"requested_start_at":{"type":"string","format":"date-time"},"requested_end_at":{"type":"string","format":"date-time"}},"required":["catalog_service_ids","reason"],"additionalProperties":false}
      responses:
        "200":
          description: Successful existing API response
        "201":
          description: Created
  /v1/organizations/{org_id}/access-requests:
    get:
      summary: List access requests
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: environment_id
          in: query
          schema: {type: string, format: uuid}
        - name: service_id
          in: query
          schema: {type: string}
        - name: state
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Access request list
  /v1/organizations/{org_id}/access-requests/{id}:
    get:
      operationId: grant_status
      summary: grant status
      description: Existing request fields plus grants and status pending, active, denied, expired or revoked. Windows and decisions are in grants.
      parameters:
        - {"name":"org_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
        - {"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
      responses:
        "200":
          description: Successful existing API response
          content:
            application/json:
              schema: {"type":"object","properties":{"status":{"type":"string","enum":["pending","active","denied","expired","revoked"]},"grants":{"type":"array","items":{"type":"object","properties":{"valid_from":{"type":"string","format":"date-time"},"valid_until":{"type":"string","format":"date-time"}}}}}}
  /v1/organizations/{org_id}/access-requests/{id}/cancel:
    post:
      summary: Cancel a Requested access request
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Access request
  /v1/organizations/{org_id}/access-requests/{id}/approve:
    post:
      summary: Approve a Requested access request and create a grant per member Service
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Access request plus created grants; decision_authority customer or customer_delegated
  /v1/organizations/{org_id}/access-requests/{id}/grants:
    get:
      summary: List grants created from an access request
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Grants for each member Service
  /v1/organizations/{org_id}/access-requests/{id}/deny:
    post:
      summary: Deny a Requested access request
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Access request
  /v1/organizations/{org_id}/access-grants:
    get:
      summary: List access grants
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: environment_id
          in: query
          schema: {type: string, format: uuid}
        - name: service_id
          in: query
          schema: {type: string}
        - name: state
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Access grant list with created_at and revoked_at
  /v1/organizations/{org_id}/access-grants/{id}:
    get:
      summary: Get access grant
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Access grant with created_at and revoked_at
  /v1/organizations/{org_id}/access-grants/{id}/revoke:
    post:
      operationId: revoke_access
      summary: revoke access
      description: Revoke existing grant and reset bounded streams.
      parameters:
        - {"name":"org_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
        - {"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"reason":{"type":"string"}},"additionalProperties":false}
      responses:
        "200":
          description: Successful existing API response
  /v1/organizations/{org_id}/access-grants/{id}/credentials:
    post:
      operationId: connect
      summary: connect
      description: Return bounded Caller credential and Broker connection material. CLI or SDK opens the stream; MCP does not carry streams. Refuses outside the grant window.
      parameters:
        - {"name":"org_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
        - {"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{},"additionalProperties":false}
      responses:
        "200":
          description: Successful existing API response
        "201":
          description: Created
  /v1/organizations/{org_id}/connections:
    get:
      summary: List connection records
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: environment_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Connection list with opened_at, closed_at, authorized_at, environment_name, service_display_name, subject_display_name
  /v1/organizations/{org_id}/connections/{id}:
    get:
      summary: Get connection record
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Connection record with timestamps and display names
  /v1/organizations/{org_id}/environment-selections:
    post:
      operationId: ensure_environment
      summary: ensure environment
      description: Select by external_deployment_id plus external_customer_id when supplied, otherwise by exact trimmed name; create through existing create handler and plan limits. Serialized by the API write mutex. Returns 200 selected or 201 created.
      parameters:
        - {"name":"org_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"name":{"type":"string"},"region_id":{"type":"string","format":"uuid"},"external_customer_id":{"type":"string"},"external_deployment_id":{"type":"string"}},"required":["name","region_id"],"additionalProperties":false}
      responses:
        "200":
          description: Successful existing API response
        "201":
          description: Created
  /v1/organizations/{org_id}/environments/{env_id}/agent-installs:
    post:
      operationId: send_agent_install
      summary: send agent install
      description: Mint existing one-use enrollment and synchronously email it; code never returned or persisted in the outbox. Reusing display_name expands the named Agent Service authorization. Delivery failure revokes the code.
      parameters:
        - {"name":"org_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
        - {"name":"env_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"recipient":{"type":"string"},"display_name":{"type":"string"},"service_ids":{"type":"array","minItems":1,"items":{"type":"string"}},"ttl_seconds":{"type":"integer","minimum":1,"maximum":86400}},"required":["recipient","service_ids"],"additionalProperties":false}
      responses:
        "200":
          description: Successful existing API response
        "201":
          description: Created
  /v1/organizations/{org_id}/access-requests/{id}/approve-link:
    post:
      operationId: send_approve_link
      summary: send approve link
      description: Queue mail to active Environment Approvers. Link opens authenticated console request page; only explicit POST approves. No tool can approve.
      parameters:
        - {"name":"org_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
        - {"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{},"additionalProperties":false}
      responses:
        "200":
          description: Successful existing API response
  /v1/organizations/{org_id}/access-requests/{id}/report:
    get:
      operationId: get_report
      summary: get report
      description: Request and grants with requester, decider, windows, revoke and expiry; matching connections including opened and closed times.
      parameters:
        - {"name":"org_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
        - {"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
      responses:
        "200":
          description: Successful existing API response
          content:
            application/json:
              schema: {"type":"object","properties":{"request":{"type":"object"},"connections":{"type":"array","items":{"type":"object"}},"audit_events":{"type":"array","items":{"type":"object"}}}}
  /v1/mcp:
    get:
      summary: MCP has no server event stream
      responses:
        "405":
          description: Method not allowed; Allow POST
        "401":
          description: Authentication required
    delete:
      summary: MCP has no server session to terminate
      responses:
        "405":
          description: Method not allowed; Allow POST
        "401":
          description: Authentication required
    post:
      summary: MCP Streamable HTTP JSON-RPC 2.0
      description: Stateless JSON responses. Supports initialize, notifications/initialized, ping, tools/list and tools/call. Exactly ten tools whose schemas derive from the matching operation parameters and JSON request body. Same session or Service Identity bearer authentication; an invalid Origin is refused. No server initiated messages or stream transport.
      responses:
        "200":
          description: JSON-RPC response or MCP tool result with isError and existing API error
        "202":
          description: Notification accepted
        "401":
          description: Missing or invalid authentication
components:
  parameters:
    OrgId:
      name: org_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvId:
      name: env_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: thirp_session
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - mfa_required
                - not_found
                - invalid_request
                - conflict
                - suspended
                - disabled
                - archived
                - rate_limited
                - idempotency_conflict
                - quota_exceeded
                - internal
            message:
              type: string
            request_id:
              type: string
security:
  - bearerAuth: []
  - cookieAuth: []
x-rate-limits:
  authenticated_reads: 480/min
  authenticated_writes: 60/min
  login: 10 failures / 15 min per challenge
  enrollment_exchange: 10 failures / 15 min
